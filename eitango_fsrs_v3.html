const W=DATA.map(([id,w,m])=>({id,w,m})),BY=new Map(W.map(x=>[x.id,x])),DAY=864e5,KJ=/[\u4e00-\u9fff々]/;

function clash(a,b){if(a.m===b.m)return true;for(const s of info(a).S)for(const t of info(b).S){if(s===t||(s.length>1&&t.length>1&&(s.includes(t)||t.includes(s)))||(s[0]===t[0]&&KJ.test(s[0])))return true;for(const h of bgK(s))if(t.includes(h))return true}return false}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}

 for(let n=Math.max(1,x.w.length-2);n<=x.w.length+2;n++)for(const y of WORDS_BY_LENGTH.get(n)||[])if(y!==x&&lev(low(x),low(y))<=lim)out.push(y);
 return x.N=out}
const alts=t=>(WORDS_BY_MEANING.get(t.m)||[]).filter(x=>x.id!==t.id);
let lastSig='';const rnd=a=>a[Math.random()*a.length|0],shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
// 4択生成：約70%（試行85%×候補有無）で「スペル類似」「意味が近い(共通漢字あり・同義でない)」を混ぜ、候補が無ければ通常のランダム
function simM(t){return t.SM||(t.SM=(WORDS_BY_KIND.get(info(t).kind)||[]).filter(x=>x!==t&&[...info(x).K].some(c=>info(t).K.has(c))))}
function makeQ(t,dir){const ti=info(t);let q;
 for(let tr=0;tr<5;tr++){const pk=[],ok=x=>x!==t&&low(x)!==low(t)&&!clash(x,t)&&pk.every(p=>low(p.x)!==low(x)&&!clash(p.x,x));
  if(Math.random()<.85){const a=near(t).filter(ok),b=simM(t).filter(ok);
   for(const[x,f]of shuf([...(a.length?[[rnd(a),'s']]:[]),...(b.length?[[rnd(b),'m']]:[])]).slice(0,Math.random()<.5?1:2))if(ok(x))pk.push({x,f})}
  for(let k=0;pk.length<3&&k<500;k++){const x=rnd(W);if((k>200||info(x).kind===ti.kind)&&ok(x))pk.push({x,f:''})}
  if(pk.length<3)continue;
  const o=shuf([{x:t,c:1},...pk]);q={t,dir,opts:o,hard:pk.some(p=>p.f),ans:o.findIndex(z=>z.c)};
  const sig=o.map(z=>z.x.id).sort((a,b)=>a-b).join();if(sig!==lastSig){lastSig=sig;break}}

function selfTest(step=3){let n=0,bad=0,hard=0;for(let i=0;i<W.length;i+=step)for(const d of['ej','je']){const t=W[i],q=makeQ(t,d);n++;const tx=q.opts.map(o=>d=='ej'?o.x.m:o.x.w);
 if(q.opts.length<4||new Set(tx).size<4||q.opts.some(o=>!o.c&&(o.x.m===t.m||low(o.x)===low(t)||clash(o.x,t))))bad++;if(q.hard)hard++}

const P=new Map(),LOG=new Map(),META={goal:20,retention:.9};
const MODE_KEYS=['ej','je','t'];
const blankMode=()=>({n:0,ok:0,ms:0});
const blankRecord=id=>({id,n:0,ok:0,ng:0,st:0,last:0,due:0,lv:0,fav:0,m:[0,0],t:[0,0],cf:0,lr:-1,first:0,modeStats:{ej:blankMode(),je:blankMode(),t:blankMode()},fsrs:{}});
const FSRS_VERSION=6;
// FSRS-6の公開デフォルトパラメータ。個人の履歴から最適化した重みではありません。
const FSRS_W=[.212,1.2931,2.3065,8.2956,6.4133,.8334,3.0194,.001,1.8722,.1666,.796,1.4835,.0614,.2629,1.6483,.6014,1.8729,.5425,.0912,.0658,.1542];
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const acc=a=>a&&a[0]?a[1]/a[0]:1,eod=()=>{const d=new Date(Date.now());d.setHours(23,59,59,999);return d.getTime()};
const ymd=(t=Date.now())=>new Date(t-new Date(t).getTimezoneOffset()*6e4).toISOString().slice(0,10);
const nz=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
function legacyState(a,last,due){
 const n=Array.isArray(a)?(+a[0]||0):0,ok=Array.isArray(a)?(+a[1]||0):0;if(!n)return null;
 const accuracy=ok/n,stability=due&&last?clamp((due-last)/DAY,.2,3650):clamp(1+Math.sqrt(n)*accuracy,.2,60);
 return{s:stability,d:clamp(8-accuracy*7,1,10),last:last||Date.now(),due:due||Date.now()+DAY,reps:n,lapses:Math.max(0,n-ok),migrated:true};
}
function normalizeRecord(p){
 if(!p.m)p.m=[0,0];if(!p.t)p.t=[0,0];
 if(!p.modeStats)p.modeStats={ej:blankMode(),je:blankMode(),t:blankMode()};
 for(const m of MODE_KEYS){if(!p.modeStats[m])p.modeStats[m]=blankMode();if(!Number.isFinite(p.modeStats[m].ms))p.modeStats[m].ms=0}
 if(!p.fsrs){p.fsrs={
   // 旧版では2種類の4択成績が統合されていたため、両4択モードの初期値は旧4択記録から推定。
   ej:legacyState(p.m,p.last,p.due),je:legacyState(p.m,p.last,p.due),t:legacyState(p.t,p.last,p.due)
 }}
 p.fsrsVersion=FSRS_VERSION;return p;
}
const rec=id=>{let p=P.get(id);if(!p)return blankRecord(id);return normalizeRecord(p)};
function fsrsRetrievability(state,now=Date.now()){
 if(!state||!(state.s>0)||!state.last)return 1;
 const elapsed=Math.max(0,(now-state.last)/DAY),factor=Math.pow(.9,-1/FSRS_W[20])-1;
 return Math.pow(1+factor*elapsed/state.s,-FSRS_W[20]);
}
function fsrsIntervalDays(stability,retention=META.retention||.9){const w=FSRS_W,factor=Math.pow(.9,-1/w[20])-1,r=clamp(+retention||.9,.75,.99);return clamp(Math.round(stability/factor*(Math.pow(r,-1/w[20])-1)),1,3650)}
function recalculateSchedules(){const L=[];for(const [id,raw] of P){const p=normalizeRecord(raw);for(const m of MODE_KEYS){const z=p.fsrs[m];if(z&&z.s>0){z.interval=fsrsIntervalDays(z.s,META.retention||.9);z.due=(z.last||Date.now())+z.interval*DAY}}refreshDue(p);L.push(p)}putMany('p',L)}
function fsrsReview(previous,rating,now=Date.now(),retention=META.retention||.9){
 const w=FSRS_W,g=clamp(Math.round(+rating||3),1,4),old=previous&&previous.s>0?previous:null;
 let S,D,R=1,elapsed=0;
 const initialD=grade=>clamp(w[4]-Math.exp(w[5]*(grade-1))+1,1,10);
 if(!old){S=w[g-1];D=initialD(g)}
 else{
  S=old.s;D=old.d;elapsed=Math.max(0,(now-(old.last||now))/DAY);R=fsrsRetrievability(old,now);

  const d0easy=initialD(4),delta=-w[6]*(g-3)*(10-D)/9;

   S=Math.min(w[11]*Math.pow(D,-w[12])*(Math.pow(S+1,w[13])-1)*Math.exp(w[14]*(1-R)),S/Math.exp(w[17]*w[18])); // 忘却後の安定度は直前のSを超えない
  }else if(elapsed<1){

  }else{

}
function refreshDue(p){const due=MODE_KEYS.map(m=>p.fsrs&&p.fsrs[m]&&p.fsrs[m].due).filter(Number.isFinite);if(due.length)p.due=Math.min(...due)}
function grade(p,rating,mode,elapsedMs=0){

const HS=[['h1','学習の始め方'],['h2','設定の詳細'],['h3','学習中の操作と判定'],['h4','各機能の詳細'],['h5','学習状態の判定条件'],['h6','復習期限と習熟度'],['h7','学習履歴・学習時間・統計'],['h8','バックアップ（エクスポート・インポート）'],['h9','出題ルール（誤解しやすい点）'],['h10','FAQ'],['h11','プレビュー機能']];
function helpHtml(){const L=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>',D=(id,t,b)=>`<details id=${id} class=card><summary><b>${t}</b></summary><div class=hb>${b}</div></details>`,fl=a=>a.map(x=>`<span class=tag style="background:var(--l);color:var(--t)">${x}</span>`).join('→');
 return `<h2>使い方・機能説明</h2><div class=card><div class=s>目次（タップで該当項目へ移動）</div>${HS.map(([k,t],i)=>`<button class=ch data-a=hj data-v=${k}>${i+1}. ${t}</button>`).join('')}</div>
<div class=card><div class=s>設定の流れ</div><div>${fl(['①範囲','②学習状態','③モード','④問題数','⑤出題順','⑥確認→開始'])}</div><div class=s style="margin-top:8px">出題の内部処理（それぞれ独立）</div><div>${fl(['対象単語の抽出','問題数の決定','出題順の決定','モードの抽選'])}</div></div>`
+D('h1','1. 学習の始め方',L(['<b>構成</b>：下のタブは ホーム（学習状況・グラフ）／学習（出題設定と学習）／単語帳（検索・詳細・発音・お気に入り）／記録（学習履歴・統計）／設定。使い方とプレビューはホームと設定にあります。','<b>開始</b>：学習タブで STEP1〜5 を選び、最下部の確認欄で対象単語数と問題数を確かめて「学習を開始」。対象が0語・範囲や問題数の入力が不正・モード未選択のときは開始できず、理由が表示されます。設定は端末に保存され、次回も復元されます。','<b>結果</b>：最後の問題に答えて「次へ」を押すか、途中で「✕ 終了」を押すと結果画面になります。「続けて学習する」は範囲・状態・モード・問題数・出題順を引き継いで新しいセッションを開始し、通常の記録として保存します。']))
+D('h2','2. 設定の詳細',L(['<b>出題範囲</b>：「全範囲」は登録された全単語。「番号範囲指定」は単語番号（元データの番号）で開始〜終了を入力します（1以上の整数・開始≦終了）。「＋範囲を追加」で複数指定でき、✕で削除。範囲が重なっても同じ単語は1回だけ数え、存在しない番号は無視されます。','<b>学習状態</b>：全状態／未学習／間違えた／苦手／復習期限／お気に入り／習得済み。複数選ぶと「いずれかに該当」する単語が対象です。全状態を選ぶと他は解除され、他を選ぶと全状態は外れます。最後の1つを外すと全状態に戻ります。','<b>範囲と状態の関係</b>：番号範囲 かつ 選んだ状態のいずれか、を満たす単語だけが対象です。','<b>学習モード</b>：3つをチェックで選択（複数可・1つ以上必須）。','<b>問題数</b>：10／20／50／100、または自由入力（1〜'+MAXQ+'の整数。0・負数・小数・文字・空欄は不可）。','<b>出題順</b>：番号順＝番号の小さい順（問題数が少なければ小さい番号から）。ランダム＝対象語をシャッフルして出題。']))
+D('h3','3. 学習中の操作と判定',L(['画面上部に現在のモードと残り問題数が表示されます。','<b>4択</b>：選択肢をタップ（キーボードは1〜4）。タップした時点で確定し、取り消せません。正解は緑、誤答は赤。各選択肢の下に対応する語（英語または日本語）が出ます。','<b>入力（タイピング）</b>：英単語を入力して「回答」またはEnter。大文字小文字と前後の空白は無視、連続した空白は1つとして扱い、スペルは厳密に判定します。同じ日本語訳を持つ別の語を入力した場合は「意味は部分正解」と表示しますが、指定語の想起・スペルは未達として再復習します。確定後は変更できません。不正解のときは入力と正解を並べ、違う文字を赤で示します。','回答後、正解なら「難しかった／普通／簡単」、不正解なら「もう一度」を選ぶと記録されます（キーボードは2〜4、Enterで「普通」／「もう一度」）。誤答は同じ学習モードで3問程度あとに最大2回まで再出題します。正解の自己評価で復習間隔が変わります。','<b>発音</b>：英語→日本語は問題表示時に自動で1回。日本語→英語は回答が確定した後に正解の英単語を自動発音します（回答前は発音しません）。🔊で何度でも再生でき、押すと再生中の音声を止めて最初から再生します（回答は確定しません）。単語帳の詳細を開いたときも自動発音。自動発音は設定でOFFにでき、OFFでも🔊は使えます。','<b>記録</b>：4択と入力の成績は別々に記録されます。誤答は数問後に同じ学習モードで最大2回まで再出題され、結果画面から誤答単語だけをまとめて再学習することもできます。']))
+D('h4','4. 各機能の詳細',L(['<b>英単語帳</b>：英単語・日本語訳で検索、絞り込み（すべて／苦手／★／未学習／学習中／習得済み）。行の🔊でその単語だけ発音、行をタップすると詳細（回答回数・4択/入力別の成績・連続正解・習熟度・最終学習・次回復習・苦手の理由・同じ訳の語・スペルが近い語）。一覧を開いただけでは発音しません。','<b>英語→日本語4択</b>：英単語を見て日本語訳を4つから選びます。','<b>日本語→英語4択</b>：日本語訳を見て英単語を4つから選びます。','<b>日本語→英語タイピング</b>：日本語訳を見て英単語を入力します。スペルの定着用です。','<b>類似単語を使った選択肢</b>：約70%の問題で、スペルが近い語（編集距離1〜2）または意味が近い語（訳に共通の漢字を含み、同義とはみなせない語）を少なくとも1つ混ぜ、残りは通常のランダム選択です。同じ訳・包含・先頭漢字が同じ訳などは誤答に使いません。適切な候補がなければ無理に作りません。同じ選択肢の組み合わせは連続しません。','<b>発音の仕組み</b>：ブラウザのWeb Speech API。音声は en-US と完全一致するものを優先し、次に他の米国英語（en_US など）、なければ en-US を指定したシステム標準の音声を使います（英国英語は優先しません）。既定の速度は0.95。使用中の音声名と言語コードは設定画面に表示されます。','復習はFSRS-6の標準パラメータを用います。利用者ごとのパラメータ自動学習は行いません。元データには品詞・発音記号・例文がないため、それらは表示しません。']))
+D('h5','5. 学習状態の判定条件',`<table><tr><td><b>未学習</b></td><td>一度も回答していない（回答数0）</td></tr><tr><td><b>間違えた</b></td><td>直近の回答が不正解</td></tr><tr><td><b>苦手</b></td><td>次のいずれか：4択の正答率が60%未満（2回以上回答）＝意味／入力の正答率が60%未満（1回以上回答）＝スペル／似た選択肢を選んで誤答した回数が2回以上＝混同／連続正解2回以上まで進んだ後、最終学習から30日を超えた＝忘却／上記に当たらなくても3回以上回答して全体の正答率が60%未満</td></tr><tr><td><b>復習期限</b></td><td>回答済みで、次回復習日が今日（23:59）までに来ている</td></tr><tr><td><b>お気に入り</b></td><td>★を付けた単語</td></tr><tr><td><b>習得済み</b></td><td>連続正解が4回以上</td></tr><tr><td><b>学習中</b></td><td>回答済みで、習得済みではない</td></tr></table><div class=s>1つの単語が複数の状態に当てはまることがありますが、対象単語数では二重に数えません。</div>`)
+D('h6','6. 復習期限と習熟度',L(['FSRS-6で、記憶の安定度（S）・難易度（D）・想起可能性（R）からモード別に次回復習日を計算します。正解後はHard／Good／Easy、不正解はAgainとして記録します。目標想起率は設定で変更できます。','英語→日本語、日本語→英語、タイピングは別々の記憶状態と復習期限を持ちます。','旧版の4択記録は英→日／日→英に分離されていないため、両モードの初期状態を旧版の統合成績から推定します。新バージョン以降の履歴は正確に分離して記録します。','習熟度表示は従来の連続正解回数に基づく目安として残し、復習スケジュールはFSRS-6で独立して計算します。']))
+D('h7','7. 学習履歴・学習時間・統計',L(['1回の学習を1セッションとして、開始・終了日時、範囲、学習状態、モード別の出題数・正解数・不正解数・正答率・学習時間を記録します（「記録」タブ）。','<b>学習時間</b>：1問が表示されてから回答が確定するまで。バックグラウンド（画面を閉じた・別アプリ）の間は除外し、1問の上限は'+CAP/1000+'秒。セッション全体の経過時間（開始〜終了）と、実際に問題に取り組んだ時間は別々に表示します。','期間は 今日／7日／30日／90日／累計 を切り替え。総学習時間・出題数・正解数・不正解数・正答率とモード別の集計、日別の学習時間・出題数、モード別の比較グラフを表示します。セッションをタップすると回答一覧まで見られます。','ホームの日別グラフ・連続学習日数は、セッション機能の追加前の記録も含みます（それ以前の分にはモード別・時間の記録はありません）。']))
+D('h8','8. バックアップ（エクスポート・インポート）',L(['データはこの端末のブラウザ内（IndexedDB）に保存され、別の端末には引き継がれません。','設定の「ファイルに保存」でJSONファイルを端末に保存できます（「書き出す」はJSONのコピー）。14日以上バックアップがないとホームでお知らせします。復元は設定のテキスト欄に貼り付け（またはファイル選択）して「読み込む」（インポート）。','読み込みでは既存を上書きしません。未登録の単語記録を追加し、既存より学習回数が多いものだけ更新し、セッションは未登録のものだけ追加します。取り込む前に件数を確認できます。','初期化は確認ボタンを押すまで実行されません。']))
+D('h9','9. 出題ルール（誤解しやすい点）',L(['複数モードを選ぶと、セッション全体で出題数ができるだけ均等になるように割り当てます。','同じモードが連続しないように並べます（選択可能なモードが複数ある場合）。復習期限の学習では、その単語で期限が来ているモードを優先します。','問題数は選んだモード全体の合計です（A・B・Cで30問なら合計30問）。','対象単語数と問題数が同じなら、ランダムでも全語を1回ずつ出題します。','問題数が対象単語数より少なければ、重複なしで出題します。','問題数が対象単語数より多ければ、まず全対象語を1回ずつ出題し、その後に再出題します（同じ単語が連続しないようにします。対象が1語だけの場合を除く）。','複数の学習状態を選ぶと、いずれかに該当する単語が対象です。','番号範囲と学習状態の両方を満たす単語だけが対象です。']))
+D('h10','10. FAQ',`<p><b>Q. 発音されない</b><br>端末の音量とiPhoneの消音スイッチを確認し、設定の「発音テスト」を試してください。🔊の手動再生は自動発音がOFFでも使えます。ブラウザが音声合成に未対応、または英語の音声が入っていない場合は鳴りません。</p><p><b>Q. iPhoneで自動発音が動かない</b><br>iOSのブラウザは、画面をタップするなどの操作の前の自動再生を制限します。学習開始ボタンなどをタップした操作の中で再生される想定ですが、鳴らない場合は🔊を押してください。</p><p><b>Q. お気に入りはどこから？</b><br>単語帳の詳細画面、または学習中の回答後に表示されるカードの☆から登録します。</p><p><b>Q. 苦手な単語の判定は？</b><br>項目5を参照。</p><p><b>Q. 復習期限は？</b><br>項目6を参照。</p><p><b>Q. 学習履歴はどこ？</b><br>「記録」タブです。</p><p><b>Q. 問題数より対象単語数が少ないと？</b><br>全対象語を1回ずつ出題してから再出題します（項目9）。開始前に確認欄で知らせます。</p><p><b>Q. バックアップは？</b><br>項目8を参照。</p><p><b>Q. ホーム画面に追加するには？（iPhone）</b><br>Safariでこのページを開き、共有ボタン→「ホーム画面に追加」を選びます。アイコンから開くとSafariとは別の保存領域になるため、先にアイコンを作ってから学習するか、書き出し→読み込みで記録を移してください。オフラインでは開けません。</p>`)
+D('h11','11. プレビュー機能',L(['ホームまたは設定の「アプリをプレビュー」から、サンプルデータで実際にアプリを操作できます。画面一覧から各画面（ホーム・学習設定・3つのモードの学習画面・単語帳・結果・履歴・統計・設定・使い方）へ移動できます。','プレビュー中は紫の表示が出ます。ここでの回答・お気に入り・設定変更は、実際の単語データ・学習履歴・お気に入り・復習期限・成績に一切反映されません（保存されません）。','「終了」を押すと通常の画面に戻り、プレビュー前の状態に復元されます。']))}

VIEW.pvm=()=>`<h2>アプリをプレビュー</h2><div class=card><div class=s>サンプルデータで実際のアプリを操作できます。ここでの操作は実際の学習履歴・単語データ・お気に入り・復習期限・成績に反映されません。終了すると通常の画面に戻ります。</div></div>${[['home','ホーム画面'],['study','学習開始設定画面'],['ej','英語→日本語4択画面'],['je','日本語→英語4択画面'],['t','日本語→英語タイピング画面'],['list','英単語帳'],['res','学習結果画面'],['hist','学習履歴画面'],['stat','学習統計・グラフ画面'],['set','設定画面'],['help','使い方・機能説明画面']].map(([k,l])=>`<button class=b data-a=pvg data-v=${k}>${l}</button>`).join('')}<button class="b p" data-a=pvx>プレビューを終了して通常画面へ戻る</button>`;
function enterPV(){if(PV||S)return;PV={z:{p:[...P],log:[...LOG],sess:[...SESS],meta:Object.assign({},META),cfg:JSON.parse(JSON.stringify(CFG)),ls:Object.assign({},LS),rp:RP,auto:SP.auto,rate:SP.rate,from:tab}};
 P.clear();LOG.clear();SESS.clear();Object.keys(META).forEach(k=>delete META[k]);META.goal=20;sampleData();
 Object.assign(CFG,{rangeMode:'rng',ranges:[['1','60']],states:['all'],modes:['ej','je','t'],nMode:'fix',nFix:10,nFree:'75',order:'rand'});DET=0;SD=0;IMP=null;RP='30';stopSay();tab='pvm';render()}
function exitPV(){if(!PV)return;const z=PV.z;tStop();stopSay();P.clear();z.p.forEach(([k,v])=>P.set(k,v));LOG.clear();z.log.forEach(([k,v])=>LOG.set(k,v));SESS.clear();z.sess.forEach(([k,v])=>SESS.set(k,v));Object.keys(META).forEach(k=>delete META[k]);Object.assign(META,z.meta);Object.assign(CFG,z.cfg);Object.assign(LS,z.ls);RP=z.rp;SP.auto=z.auto;SP.rate=z.rate;S=null;DET=0;SD=0;tab=z.from;PV=null;render()}
function enter(){const it=S.q[S.i],t=BY.get(it.id);S.cur=it.mode=='t'?{dir:'t'}:makeQ(t,it.mode);S.fb=null;tStart();if(it.mode=='ej')auto(t.w,'q'+S.sess.id+':'+S.i)}
function finish(){if(!S||S.done)return;S.done=1;tStop();stopSay();const s=S.sess;s.end=Date.now();s.planned=S.q.length;S.sum=sumS(s);if(s.qs.length){SESS.set(s.id,s);PENDING=null;put('sess',s)}}
// 回答直後はいったん保留し、正解ならHard/Good/Easy、誤答ならAgainを選んでから記録する。
